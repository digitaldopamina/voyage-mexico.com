name: Deploy to Hostinger via FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via FTP
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORDVOYAGEMEXICO }}
        run: |
          lftp -c "
            set ftp:ssl-allow no;
            open -u u165470353.voyage-mexico.com,$FTP_PASSWORD ftp://voyage-mexico.com;
            mirror --reverse --delete --verbose \
              --exclude .git \
              --exclude .github \
              --exclude .gitignore \
              . /public_html/
          "
